name: Deploy frontend to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - frontend/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - nx.json
      - .github/workflows/deploy-frontend.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Test and build frontend
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate frontend API URL
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${VITE_API_BASE_URL}" ]; then
            echo "::error::Missing github-pages variable: VITE_API_BASE_URL"
            exit 1
          fi
          case "${VITE_API_BASE_URL}" in
            https://*) ;;
            *)
              echo "::error::VITE_API_BASE_URL must use HTTPS in production."
              exit 1
              ;;
          esac
          case "${VITE_API_BASE_URL}" in
            */api) ;;
            *)
              echo "::error::VITE_API_BASE_URL must end with /api."
              exit 1
              ;;
          esac

      - name: Run frontend tests
        run: pnpm exec nx run frontend:test

      - name: Build frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: pnpm exec nx run frontend:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
