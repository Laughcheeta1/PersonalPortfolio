name: Deploy backend to Cloud Run

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - backend/**
      - .github/workflows/deploy-backend.yml

permissions:
  contents: read

concurrency:
  group: cloud-run-backend
  cancel-in-progress: true

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run backend tests
        run: uv run pytest

  deploy:
    name: Deploy backend
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: backend
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate deployment configuration
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL }}
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL }}
          OLLAMA_TIMEOUT_SECONDS: ${{ vars.OLLAMA_TIMEOUT_SECONDS }}
          ALLOWED_CORS_ORIGIN: ${{ secrets.ALLOWED_CORS_ORIGIN }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          set -euo pipefail
          for variable in \
            GCP_PROJECT_ID \
            GCP_REGION \
            CLOUD_RUN_SERVICE \
            GCP_SERVICE_ACCOUNT \
            WIF_PROVIDER \
            OLLAMA_BASE_URL \
            OLLAMA_MODEL \
            OLLAMA_TIMEOUT_SECONDS \
            ALLOWED_CORS_ORIGIN \
            OLLAMA_API_KEY
          do
            if [ -z "${!variable}" ]; then
              echo "::error::Missing backend deployment setting: ${variable}"
              exit 1
            fi
          done
          case "${ALLOWED_CORS_ORIGIN}" in
            https://*) ;;
            *)
              echo "::error::ALLOWED_CORS_ORIGIN must use HTTPS."
              exit 1
              ;;
          esac
          origin_host="${ALLOWED_CORS_ORIGIN#https://}"
          if [ -z "${origin_host}" ] || [[ "${origin_host}" == */* ]]; then
            echo "::error::ALLOWED_CORS_ORIGIN must contain only an origin."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: >-
            ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy backend source to Cloud Run
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
          OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL }}
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL }}
          OLLAMA_TIMEOUT_SECONDS: ${{ vars.OLLAMA_TIMEOUT_SECONDS }}
          ALLOWED_CORS_ORIGIN: ${{ secrets.ALLOWED_CORS_ORIGIN }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          set -euo pipefail
          env_vars="^|||^OLLAMA_BASE_URL=${OLLAMA_BASE_URL}"
          env_vars="${env_vars}|||OLLAMA_MODEL=${OLLAMA_MODEL}"
          env_vars="${env_vars}|||OLLAMA_TIMEOUT_SECONDS=${OLLAMA_TIMEOUT_SECONDS}"
          env_vars="${env_vars}|||CORS_ORIGINS=[\"${ALLOWED_CORS_ORIGIN}\"]"
          env_vars="${env_vars}|||OLLAMA_API_KEY=${OLLAMA_API_KEY}"
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --source ./backend \
            --allow-unauthenticated \
            --set-env-vars "${env_vars}"
