name: Deploy application

on:
  workflow_dispatch:
    inputs:
      deploy_frontend:
        description: Deploy the frontend to GitHub Pages
        required: false
        default: true
        type: boolean
      deploy_backend:
        description: Test and deploy the backend to Cloud Run
        required: false
        default: true
        type: boolean
  push:
    branches:
      - master
    paths:
      - frontend/**
      - backend/**
      - infra/tailnet-db-proxy/**
      - infra/deploy/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - nx.json
      - .github/workflows/deploy.yml

permissions:
  contents: read

concurrency:
  group: application-deployment
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed applications
    runs-on: ubuntu-latest
    outputs:
      frontend_changed: ${{ steps.filter.outputs.frontend_changed }}
      backend_app_changed: ${{ steps.filter.outputs.backend_app_changed }}
      tailnet_proxy_changed: ${{ steps.filter.outputs.tailnet_proxy_changed }}
      deployment_config_changed: ${{ steps.filter.outputs.deployment_config_changed }}
      backend_changed: ${{ steps.filter.outputs.backend_changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine changed applications
        id: filter
        env:
          BEFORE_SHA: ${{ github.event.before || github.sha }}
          MANUAL_DEPLOY_FRONTEND: ${{ inputs.deploy_frontend }}
          MANUAL_DEPLOY_BACKEND: ${{ inputs.deploy_backend }}
        run: |
          set -euo pipefail
          frontend_changed=false
          backend_app_changed=false
          tailnet_proxy_changed=false
          deployment_config_changed=false

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            frontend_changed="${MANUAL_DEPLOY_FRONTEND}"
            backend_app_changed="${MANUAL_DEPLOY_BACKEND}"
            tailnet_proxy_changed="${MANUAL_DEPLOY_BACKEND}"
            deployment_config_changed="${MANUAL_DEPLOY_BACKEND}"
          else
            if [[ "${BEFORE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
              changed_files="$(git ls-tree -r --name-only "${GITHUB_SHA}")"
            else
              changed_files="$(git diff --name-only "${BEFORE_SHA}" "${GITHUB_SHA}")"
            fi

            while IFS= read -r path; do
              [[ -z "${path}" ]] && continue
              case "${path}" in
                frontend/*|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|nx.json)
                  frontend_changed=true
                  ;;
                backend/*)
                  backend_app_changed=true
                  ;;
                infra/tailnet-db-proxy/*)
                  tailnet_proxy_changed=true
                  ;;
                infra/deploy/*|.github/workflows/deploy.yml)
                  deployment_config_changed=true
                  ;;
              esac
            done <<< "${changed_files}"
          fi

          backend_changed=false
          if [[ "${backend_app_changed}" == "true" ||
            "${tailnet_proxy_changed}" == "true" ||
            "${deployment_config_changed}" == "true" ]]; then
            backend_changed=true
          fi

          {
            echo "frontend_changed=${frontend_changed}"
            echo "backend_app_changed=${backend_app_changed}"
            echo "tailnet_proxy_changed=${tailnet_proxy_changed}"
            echo "deployment_config_changed=${deployment_config_changed}"
            echo "backend_changed=${backend_changed}"
          } >> "${GITHUB_OUTPUT}"

  frontend:
    name: Test and build frontend
    needs: changes
    if: needs.changes.outputs.frontend_changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate frontend API URL
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${VITE_API_BASE_URL}" ]; then
            echo "::error::Missing github-pages secret: VITE_API_BASE_URL"
            exit 1
          fi
          case "${VITE_API_BASE_URL}" in
            https://*) ;;
            *)
              echo "::error::VITE_API_BASE_URL must use HTTPS in production."
              exit 1
              ;;
          esac
          case "${VITE_API_BASE_URL}" in
            */api) ;;
            *)
              echo "::error::VITE_API_BASE_URL must end with /api."
              exit 1
              ;;
          esac

      - name: Run frontend tests
        run: pnpm exec nx run frontend:test

      - name: Build frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: pnpm exec nx run frontend:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy-frontend:
    name: Deploy GitHub Pages
    needs:
      - changes
      - frontend
    if: needs.changes.outputs.frontend_changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  backend:
    name: Test backend
    needs: changes
    if: needs.changes.outputs.backend_changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked dependencies
        run: uv --no-config sync --locked

      - name: Run backend tests
        run: uv --no-config run pytest

  deploy-backend:
    name: Deploy backend
    needs:
      - changes
      - backend
    if: needs.changes.outputs.backend_changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: backend
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Guard against tracked environment files
        run: |
          set -euo pipefail
          tracked_env_files="$(git ls-files | awk '
              ((/\/\.env($|\.)/ || /^\.env($|\.)/ || /\.env$/) &&
                $0 !~ /\.example$/ && $0 !~ /\.example\.env$/) { print }
            ')"
          if [[ -n "${tracked_env_files}" ]]; then
            echo "::error::A non-example environment file is tracked. Remove it before deploying."
            printf '%s\n' "${tracked_env_files}"
            exit 1
          fi

      - name: Validate deployment configuration
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ secrets.GCP_REGION }}
          ARTIFACT_REGISTRY_REPOSITORY: ${{ secrets.ARTIFACT_REGISTRY_REPOSITORY }}
          CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          TAILSCALE_DB_HOST: ${{ secrets.TAILSCALE_DB_HOST }}
          TAILSCALE_DB_PORT: ${{ secrets.TAILSCALE_DB_PORT }}
          TAILSCALE_SOCKS_PORT: ${{ secrets.TAILSCALE_SOCKS_PORT }}
          LOCAL_DB_PROXY_PORT: ${{ secrets.LOCAL_DB_PROXY_PORT }}
          PROXY_HEALTH_PORT: ${{ secrets.PROXY_HEALTH_PORT }}
          TS_HOSTNAME: ${{ secrets.TS_HOSTNAME }}
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
          OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL }}
          OLLAMA_TIMEOUT_SECONDS: ${{ secrets.OLLAMA_TIMEOUT_SECONDS }}
          ALLOWED_CORS_ORIGIN: ${{ secrets.ALLOWED_CORS_ORIGIN }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          set -euo pipefail
          for variable in \
            GCP_PROJECT_ID \
            GCP_REGION \
            ARTIFACT_REGISTRY_REPOSITORY \
            CLOUD_RUN_SERVICE \
            GCP_SERVICE_ACCOUNT \
            GCP_WORKLOAD_IDENTITY_PROVIDER \
            DATABASE_URL \
            TS_AUTHKEY \
            TAILSCALE_DB_HOST \
            TAILSCALE_DB_PORT \
            TAILSCALE_SOCKS_PORT \
            LOCAL_DB_PROXY_PORT \
            PROXY_HEALTH_PORT \
            TS_HOSTNAME \
            OLLAMA_BASE_URL \
            OLLAMA_MODEL \
            OLLAMA_TIMEOUT_SECONDS \
            ALLOWED_CORS_ORIGIN \
            OLLAMA_API_KEY
          do
            if [ -z "${!variable}" ]; then
              echo "::error::Missing backend deployment setting: ${variable}"
              exit 1
            fi
          done
          case "${ALLOWED_CORS_ORIGIN}" in
            https://*) ;;
            *)
              echo "::error::ALLOWED_CORS_ORIGIN must use HTTPS."
              exit 1
              ;;
          esac
          origin_host="${ALLOWED_CORS_ORIGIN#https://}"
          if [ -z "${origin_host}" ] || [[ "${origin_host}" == */* ]]; then
            echo "::error::ALLOWED_CORS_ORIGIN must contain only an origin."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: >-
            ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Python for manifest rendering
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv for manifest rendering
        uses: astral-sh/setup-uv@v6

      - name: Resolve and build missing deterministic images
        id: images
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ secrets.GCP_REGION }}
          ARTIFACT_REGISTRY_REPOSITORY: ${{ secrets.ARTIFACT_REGISTRY_REPOSITORY }}
        run: |
          set -euo pipefail
          backend_source_sha="$(git rev-parse HEAD:backend)"
          tailnet_source_sha="$(git rev-parse HEAD:infra/tailnet-db-proxy)"
          image_prefix="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}"
          backend_image="${image_prefix}/personal-portfolio-backend:${backend_source_sha}"
          tailnet_image="${image_prefix}/tailnet-db-proxy:${tailnet_source_sha}"

          image_exists() {
            local image="$1"
            gcloud artifacts docker images describe "${image}" \
              --project="${GCP_PROJECT_ID}" \
              --quiet \
              >/dev/null 2>&1
          }

          build_if_missing() {
            local image="$1"
            local context="$2"
            if image_exists "${image}"; then
              return 0
            fi
            gcloud builds submit "${context}" \
              --project "${GCP_PROJECT_ID}" \
              --tag "${image}" \
              --quiet
            image_exists "${image}"
          }

          build_if_missing "${backend_image}" backend
          build_if_missing "${tailnet_image}" infra/tailnet-db-proxy

          {
            printf 'backend_image=%s\n' "${backend_image}"
            printf 'tailnet_image=%s\n' "${tailnet_image}"
          } >> "${GITHUB_OUTPUT}"

      - name: Render and deploy backend with Tailscale sidecar
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ secrets.GCP_REGION }}
          ARTIFACT_REGISTRY_REPOSITORY: ${{ secrets.ARTIFACT_REGISTRY_REPOSITORY }}
          CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          BACKEND_IMAGE: ${{ steps.images.outputs.backend_image }}
          TAILNET_PROXY_IMAGE: ${{ steps.images.outputs.tailnet_image }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          TAILSCALE_DB_HOST: ${{ secrets.TAILSCALE_DB_HOST }}
          TAILSCALE_DB_PORT: ${{ secrets.TAILSCALE_DB_PORT }}
          TAILSCALE_SOCKS_PORT: ${{ secrets.TAILSCALE_SOCKS_PORT }}
          LOCAL_DB_PROXY_PORT: ${{ secrets.LOCAL_DB_PROXY_PORT }}
          PROXY_HEALTH_PORT: ${{ secrets.PROXY_HEALTH_PORT }}
          TS_HOSTNAME: ${{ secrets.TS_HOSTNAME }}
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
          OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL }}
          OLLAMA_TIMEOUT_SECONDS: ${{ secrets.OLLAMA_TIMEOUT_SECONDS }}
          ALLOWED_CORS_ORIGIN: ${{ secrets.ALLOWED_CORS_ORIGIN }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          manifest="$(mktemp "${RUNNER_TEMP}/personal-portfolio-backend.XXXXXX.json")"
          trap 'rm -f -- "${manifest}"' EXIT
          uv run --no-project python infra/deploy/render_cloud_run_manifest.py \
            --output "${manifest}"
          gcloud run services replace "${manifest}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --quiet
          gcloud run services add-iam-policy-binding "${CLOUD_RUN_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --member="allUsers" \
            --role="roles/run.invoker" \
            --quiet
