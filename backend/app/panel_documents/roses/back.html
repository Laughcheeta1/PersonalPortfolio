<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>About me · Secret garden note</title>
  <style>
    :root{--ink:#fff5e5;--muted:#f2c7c4;--rose:#ff8c9e;--leaf:#b8dc8d}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:ui-sans-serif,system-ui,sans-serif}
    body{display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#8f5261,#422c48 56%,#1b2535);color:var(--ink);padding:24px;overflow:auto}
    main{max-width:560px;text-align:center;border:1px solid #d47b8b;border-radius:24px;padding:32px 24px;background:#4d3045dd;box-shadow:0 20px 60px #0006}.eyebrow{color:var(--rose);font-size:10px;font-weight:800;letter-spacing:.22em;text-transform:uppercase}
    .flower{font-size:64px;margin:18px 0 8px;color:var(--rose);text-shadow:0 0 18px #ff8c9e88}h1{font:700 clamp(28px,7vw,44px)/1 Georgia,serif;letter-spacing:-.05em;margin:0 0 14px}.note{color:var(--muted);font-size:14px;line-height:1.65;margin:0}.signature{color:var(--leaf);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-top:22px}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">quietly hidden in the petals</div>
    <div class="flower">✿</div>
    <h1>Plot twist: the flower has opinions.</h1>
    <p class="note">Some ideas need a spreadsheet. Others need cake, a dramatic walk, and exactly the right playlist.</p>
    <div class="signature">water the curiosity</div>
  </main>
</body>
</html>
