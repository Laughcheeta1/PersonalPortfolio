<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Honors and awards · Secret pedestal note</title>
  <style>
    :root{--ink:#fff2cf;--muted:#dbc79c;--gold:#f0c567}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:ui-sans-serif,system-ui,sans-serif}
    body{display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#765c3d,#322d35 62%,#121c27);color:var(--ink);padding:24px;overflow:auto}
    main{max-width:560px;text-align:center;border:1px solid #aa8750;border-radius:24px;padding:32px 24px;background:#3a3029e8;box-shadow:0 20px 60px #0006}.eyebrow{color:var(--gold);font-size:10px;font-weight:800;letter-spacing:.22em;text-transform:uppercase}
    .crown{font-size:59px;margin:18px 0 8px;color:var(--gold);text-shadow:0 0 16px #f0c56788}h1{font:700 clamp(28px,7vw,44px)/1 Georgia,serif;letter-spacing:-.05em;margin:0 0 14px}.note{color:var(--muted);font-size:14px;line-height:1.65;margin:0}.signature{color:#f5d991;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-top:22px}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">inscription on the hidden side</div>
    <div class="crown">♛</div>
    <h1>The statue demands snacks.</h1>
    <p class="note">Victory is temporary. The post-hackathon pizza order is a permanent architectural decision.</p>
    <div class="signature">please applaud responsibly</div>
  </main>
</body>
</html>
