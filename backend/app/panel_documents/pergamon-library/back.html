<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library of Pergamon · Secret archive note</title>
  <style>
    :root{--ink:#fff1c8;--muted:#dbc99b;--gold:#e4b85e}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:ui-sans-serif,system-ui,sans-serif}
    body{display:grid;place-items:center;background:radial-gradient(circle at 50% 18%,#735e3e,#383342 60%,#151d2b);color:var(--ink);padding:24px;overflow:auto}
    main{max-width:560px;text-align:center;border:1px solid #ae8c4f;border-radius:24px;padding:32px 24px;background:#3b342be8;box-shadow:0 20px 60px #0006}.eyebrow{color:var(--gold);font-size:10px;font-weight:800;letter-spacing:.22em;text-transform:uppercase}
    .scroll{font-size:59px;margin:18px 0 8px;color:var(--gold)}h1{font:700 clamp(28px,7vw,44px)/1 Georgia,serif;letter-spacing:-.05em;margin:0 0 14px}.note{color:var(--muted);font-size:14px;line-height:1.65;margin:0}.signature{color:#f3d88c;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-top:22px}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">sealed archive · do not cite</div>
    <div class="scroll">📜</div>
    <h1>The architect misplaced the blueprint.</h1>
    <p class="note">Construction resumes immediately after someone remembers which drawer contains the “final-final-real” version.</p>
    <div class="signature">knowledge is under renovation</div>
  </main>
</body>
</html>
