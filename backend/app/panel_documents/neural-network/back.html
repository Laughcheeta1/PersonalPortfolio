<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skills and education · Secret node</title>
  <style>
    :root{--ink:#e9fff5;--muted:#9cc6b7;--green:#b7ee7c;--blue:#70ddd4}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:ui-sans-serif,system-ui,sans-serif}
    body{display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#1c6258,#0c2a31 65%,#07151f);color:var(--ink);padding:24px;overflow:auto}
    main{max-width:560px;text-align:center;border:1px solid #4e9d87;border-radius:24px;padding:32px 24px;background:#103b3bd9;box-shadow:0 20px 60px #0006}.eyebrow{color:var(--green);font-size:10px;font-weight:800;letter-spacing:.22em;text-transform:uppercase}
    .node{font-size:59px;margin:18px 0 8px;color:var(--blue);text-shadow:0 0 18px #70ddd499}h1{font:700 clamp(28px,7vw,44px)/1 Georgia,serif;letter-spacing:-.05em;margin:0 0 14px}.note{color:var(--muted);font-size:14px;line-height:1.65;margin:0}.signature{color:#dcf3a9;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-top:22px}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">private connection</div>
    <div class="node">✺</div>
    <h1>Knowledge is just curiosity with a memory.</h1>
    <p class="note">If you ever find a missing node, it is probably off learning something new—or taking a very serious snack break.</p>
    <div class="signature">signal still strong</div>
  </main>
</body>
</html>
