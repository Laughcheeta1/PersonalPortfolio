<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projects · Secret launch note</title>
  <style>
    :root{color-scheme:dark;--ink:#fff2cf;--muted:#d5b780;--accent:#ff9a54}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:ui-sans-serif,system-ui,sans-serif}
    body{display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#653d2e,#241b26 65%,#0d1420);color:var(--ink);padding:24px;overflow:auto}
    main{max-width:560px;text-align:center;border:1px solid #a15f43;border-radius:24px;padding:32px 24px;background:#271c28dd;box-shadow:0 20px 60px #0006}.eyebrow{color:var(--accent);font-size:10px;font-weight:800;letter-spacing:.22em;text-transform:uppercase}
    .rocket{font-size:58px;margin:18px 0 8px;transform:rotate(-18deg)}h1{font:700 clamp(28px,7vw,44px)/1 Georgia,serif;letter-spacing:-.05em;margin:0 0 14px}.note{color:var(--muted);font-size:14px;line-height:1.65;margin:0}.signature{color:#ffca74;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-top:22px}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">classified · behind the launchpad</div>
    <div class="rocket">🚀</div>
    <h1>You found the other side.</h1>
    <p class="note">Every ambitious project begins with a suspicious amount of tabs, snacks, and “one last tiny improvement.”</p>
    <div class="signature">No astronauts were harmed in this portfolio</div>
  </main>
</body>
</html>
