<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hobbies · Secret training note</title>
  <style>
    :root{--ink:#fff7df;--muted:#d7c99f;--orange:#ffb45c;--green:#a9d77b}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:ui-sans-serif,system-ui,sans-serif}
    body{display:grid;place-items:center;background:radial-gradient(circle at 50% 15%,#566b47,#263c38 60%,#111f2a);color:var(--ink);padding:24px;overflow:auto}
    main{max-width:560px;text-align:center;border:1px solid #809e61;border-radius:24px;padding:32px 24px;background:#263d36e8;box-shadow:0 20px 60px #0006}.eyebrow{color:var(--orange);font-size:10px;font-weight:800;letter-spacing:.22em;text-transform:uppercase}
    .weight{font-size:59px;margin:18px 0 8px;color:var(--orange);text-shadow:0 0 15px #ffb45c77}h1{font:700 clamp(28px,7vw,44px)/1 Georgia,serif;letter-spacing:-.05em;margin:0 0 14px}.note{color:var(--muted);font-size:14px;line-height:1.65;margin:0}.signature{color:var(--green);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-top:22px}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">unauthorized training log</div>
    <div class="weight">⚙</div>
    <h1>One more repetition.</h1>
    <p class="note">The official unit of progress is not kilograms. It is “I came back after debugging that thing.”</p>
    <div class="signature">stretch before refactoring</div>
  </main>
</body>
</html>
