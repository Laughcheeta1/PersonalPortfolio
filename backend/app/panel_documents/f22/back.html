<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Work experience · Secret flight note</title>
  <style>
    :root{--ink:#effaff;--muted:#a9cbd5;--cyan:#7de0e6;--violet:#a9a0f1}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:ui-sans-serif,system-ui,sans-serif}
    body{display:grid;place-items:center;background:radial-gradient(circle at 80% 10%,#385e78,#122b45 60%,#091728);color:var(--ink);padding:24px;overflow:auto}
    main{max-width:560px;text-align:center;border:1px solid #4c8294;border-radius:24px;padding:32px 24px;background:#123047e8;box-shadow:0 20px 60px #0006}.eyebrow{color:var(--cyan);font-size:10px;font-weight:800;letter-spacing:.22em;text-transform:uppercase}
    .mark{font-size:60px;margin:18px 0 8px;filter:drop-shadow(0 0 12px #7de0e688)}h1{font:700 clamp(28px,7vw,44px)/1 Georgia,serif;letter-spacing:-.05em;margin:0 0 14px}.note{color:var(--muted);font-size:14px;line-height:1.65;margin:0}.signature{color:#d2c8ff;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-top:22px}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">classified · turbulence ahead</div>
    <div class="mark">✈︎</div>
    <h1>Plot twist: the runway is optional.</h1>
    <p class="note">A good plan is helpful. A curious teammate, a whiteboard, and enough coffee are the emergency equipment.</p>
    <div class="signature">Please return the aircraft with full imagination</div>
  </main>
</body>
</html>
